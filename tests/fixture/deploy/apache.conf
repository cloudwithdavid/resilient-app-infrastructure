# Amazon Linux 2023: /etc/httpd/conf.d/resilient-infra.conf
# The ALB terminates HTTPS; restrict port 80 to the ALB security group.
<VirtualHost *:80>
    DocumentRoot /opt/resilient-infra/tests/fixture/site
    <Directory /opt/resilient-infra/tests/fixture/site>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 45
    ProxyPassMatch ^/(health|api/contact)$ http://127.0.0.1:8000/$1
    LimitRequestBody 16384
    <IfModule reqtimeout_module>
        RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    </IfModule>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ErrorLog logs/resilient-infra-error.log
    # Do not record query strings, referrers, request bodies, or user agents.
    LogFormat "%h %t \"%m %U %H\" %>s %b" demo_access
    CustomLog logs/resilient-infra-access.log demo_access
</VirtualHost>
